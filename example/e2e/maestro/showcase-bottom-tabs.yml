appId: ${APP_ID}
name: Showcase - Bottom Tabs
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: bottom-tabs-showcase
      TEXT: 'Midnight Waves'
- assertVisible:
    text: 'Albums'
    selected: true
- tapOn:
    id: 'open-album-albums'
- assertVisible:
    text: 'Albums'
    selected: true
- assertVisible:
    text: 'Midnight Waves'
- assertVisible:
    text: 'Luna Echo'
- tapOn:
    text: '.*For You.*'
- assertVisible:
    text: 'For You'
    selected: true
- tapOn:
    id: 'open-album-for-you'
- assertVisible:
    text: 'For You'
    selected: true
- assertVisible:
    text: 'Quiet Hours'
- assertVisible:
    text: 'Amber Field'
- tapOn:
    text: 'Radio'
- assertVisible:
    text: 'Velvet FM'
- assertVisible:
    text: 'Radio'
    selected: true
- tapOn:
    text: '.*For You.*'
- assertVisible:
    text: 'For You'
    selected: true
- assertVisible:
    text: 'Quiet Hours'
- openLink:
    link: ${APP_SCHEME}bottom-tabs-showcase/album/12
- runFlow:
    when:
      # On Web, opening a link results in fresh page load
      platform: web
    commands:
      - assertVisible:
          text: 'Albums'
          selected: true
- runFlow:
    when:
      true: ${maestro.platform != 'web'}
    commands:
      - assertVisible:
          text: 'For You'
          selected: true
- assertVisible:
    text: 'Signal Lost'
- assertVisible:
    text: 'Pixel Drift'
- tapOn:
    text: 'Search'
- assertVisible:
    text: 'Browse Categories'
- runFlow:
    when:
      # On iOS, the search bar is focused automatically when the tab is selected
      true: ${maestro.platform != 'ios'}
    commands:
      - tapOn:
          text: 'Search'
          above:
            text: 'Browse Categories'
- inputText: 'Chrome'
- tapOn:
    text: '.*Chrome Valley.*'
- assertVisible:
    text: 'Silver Thread'
- tapOn:
    text: 'Albums'
- assertVisible:
    text: 'Albums'
    selected: true
- assertNotVisible:
    text: 'Silver Thread'
