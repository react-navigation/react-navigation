appId: ${APP_ID}
name: Bottom Tabs
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: bottom-tabs
      TEXT: 'Article by Gandalf'
- tapOn:
    text: 'Navigate to feed'
- assertVisible:
    text: 'Feed'
# On iOS, the tab button's accessibility label is "<title>, tab, <n> of <total>"
- tapOn:
    text: 'Albums(, tab, .*)?'
- assertVisible:
    text: 'Albums'
- tapOn:
    text: 'Go to Chat'
- assertVisible:
    text: 'Chat'
- tapOn:
    text: 'Contacts(, tab, .*)?'
- assertVisible:
    text: 'Marissa Castillo'
- tapOn:
    text: 'Article(, tab, .*)?'
- assertVisible:
    text: 'Article by Gandalf'
- tapOn:
    text: 'Navigate to feed'
- assertVisible:
    text: 'Feed'
- tapOn:
    text: 'Article(, tab, .*)?'
- assertVisible:
    text: 'Article by Gandalf'
