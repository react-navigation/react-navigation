appId: ${APP_ID}
name: Dynamic Tabs
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: dynamic-tabs
      TEXT: 'Tab 0'
# On iOS, the tab button's accessibility label is "<title>, tab, <n> of <total>"
- tapOn:
    text: 'Add a tab'
- assertVisible:
    text: 'Tab 2(, tab, .*)?'
- tapOn:
    text: 'Add a tab'
- assertVisible:
    text: 'Tab 3(, tab, .*)?'
- tapOn:
    text: 'Add a tab'
- assertVisible:
    text: 'Tab 4(, tab, .*)?'
- tapOn:
    text: 'Remove a tab'
- assertNotVisible:
    text: 'Tab 4(, tab, .*)?'
- tapOn:
    text: 'Remove a tab'
- assertNotVisible:
    text: 'Tab 3(, tab, .*)?'
