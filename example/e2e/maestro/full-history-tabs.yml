appId: ${APP_ID}
name: Full History Tabs
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: full-history-tabs
      TEXT: 'Tab First (-)'
- tapOn:
    text: 'Navigate to Second'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Second (1)'
- tapOn:
    text: 'Navigate to First'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab First (2)'
- tapOn:
    text: 'Navigate to Third'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Third (3)'
- tapOn:
    text: 'Navigate to Second'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Second (4)'
- tapOn:
    text: 'First(, tab, .*)?'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab First (2)'
- tapOn:
    text: 'Go back'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Second (4)'
- tapOn:
    text: 'Go back'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Third (3)'
- tapOn:
    text: 'Go back'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab First (2)'
- tapOn:
    text: 'Go back'
    retryTapIfNoChange: false
- assertVisible:
    text: 'Tab Second (1)'
- tapOn:
    text: 'Go back'
    retryTapIfNoChange: false
