appId: ${APP_ID}
name: Stack Transparent
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: stack-transparent
      TEXT: 'Article'
- tapOn:
    text: 'Show Dialog'
- assertVisible:
    text: 'Okay'
- tapOn:
    text: 'Okay'
- assertNotVisible:
    text: 'Okay'
- tapOn:
    text: 'Push NewsFeed'
- assertVisible:
    text: 'NewsFeed'
- tapOn:
    text: 'Show Dialog'
- assertVisible:
    text: 'Okay'
- tapOn:
    text: 'Okay'
- assertNotVisible:
    text: 'Okay'
