appId: ${APP_ID}
name: Native Bottom Tabs - Basic
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: native-bottom-tabs
      TEXT: 'Article by Gandalf'
- tapOn:
    text: 'Update params'
- assertVisible:
    text: 'Article by Babel fish'
- tapOn:
    text: 'Navigate to feed'
- assertVisible:
    text: 'Replace with contacts'
- tapOn:
    text: 'Albums'
- assertVisible:
    text: 'Albums'
- tapOn:
    text: 'Go to Contacts'
- assertVisible:
    text: 'Marissa Castillo'
- scroll
- assertNotVisible:
    text: 'Marissa Castillo'
- tapOn:
    text: 'Contacts'
- extendedWaitUntil:
    visible:
      text: 'Marissa Castillo'
    timeout: 5000
- tapOn:
    text: 'Albums'
- assertVisible:
    text: 'Albums'
- tapOn:
    text: 'Article'
- assertVisible:
    text: 'Article by Babel fish'
- tapOn:
    text: 'Navigate to feed'
- assertVisible:
    text: 'Replace with contacts'
- tapOn:
    text: 'Article'
- assertVisible:
    text: 'Article by Babel fish'
- tapOn:
    text: 'Feed'
- assertVisible:
    text: 'Joke bot'
- scrollUntilVisible:
    element:
      text: 'Someone broke into my house and stole 20% of my couch. Ouch!'
- assertVisible:
    text: 'Someone broke into my house and stole 20% of my couch. Ouch!'
- assertNotVisible:
    text: 'Article by Babel fish'
- tapOn:
    text: 'Article'
- assertVisible:
    text: 'Article by Babel fish'
