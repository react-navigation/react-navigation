appId: ${APP_ID}
name: Stack Preload Flow
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: stack-preload-flow
      TEXT: 'Home'
- tapOn:
    text: 'Preload Details'
- tapOn:
    text: 'Navigate Details'
- extendedWaitUntil:
    timeout: 7000
    visible: 'Loaded!'
- tapOn:
    text: 'Back to home'
- assertVisible:
    text: 'Navigate Details'
- tapOn:
    text: 'Navigate Details'
- assertVisible:
    text: 'Loading...'
- extendedWaitUntil:
    timeout: 7000
    visible: 'Loaded!'
