appId: ${APP_ID}
name: Static Screen
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: static-screen
      TEXT: 'Albums'
- tapOn:
    text: 'Show Chat'
- assertVisible:
    text: 'Chat(, tab, .*)?'
- tapOn:
    text: 'Chat(, tab, .*)?'
- assertVisible:
    text: 'sudo make me a sandwich'
- tapOn:
    text: 'Albums(, tab, .*)?'
- assertVisible:
    text: 'Hide Chat'
- tapOn:
    text: 'Hide Chat'
- assertNotVisible:
    text: 'Chat(, tab, .*)?'
