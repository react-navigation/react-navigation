appId: ${APP_ID}
name: Tab Preload Flow
---
- runFlow:
    file: ../launch.yml
    env:
      LINK: tab-preload-flow
      TEXT: 'Home'
- tapOn:
    text: 'Preload screen'
- tapOn:
    text: 'Navigate'
- extendedWaitUntil:
    timeout: 10000
    visible: 'Loaded!'
- tapOn:
    text: 'Back to home'
- assertVisible:
    text: 'Preload screen'
- tapOn:
    text: 'Navigate'
- assertVisible:
    text: 'Loaded!'
