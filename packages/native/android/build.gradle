import groovy.json.JsonOutput
import groovy.json.JsonSlurper

buildscript {
  ext.ReactNavigation = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNavigation[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "org.reactnavigation"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.register('copyMaterialFonts', Copy) {
  def packageJsonFile = file(rootDir.path + "/../package.json")
  def materialSymbolsConfig = null
  def fontsConfig = null

  if (packageJsonFile.exists()) {
    def packageJson = new JsonSlurper().parse(packageJsonFile)

    materialSymbolsConfig = packageJson["react-navigation"]?.get("material-symbols")
    fontsConfig = materialSymbolsConfig?.get("fonts")
  }

  def packageDir = projectDir.canonicalFile.parentFile
  def materialSymbolsDir = [
    new File(packageDir, "node_modules/@react-navigation/material-symbols"),
    new File(packageDir.parentFile.parentFile, "@react-navigation/material-symbols")
  ].find { it.exists() }

  if (materialSymbolsDir == null) {
    materialSymbolsDir = new File(
      providers.exec {
        workingDir(projectDir)
        commandLine("node", "--print", "require.resolve('@react-navigation/material-symbols/package.json')")
      }.standardOutput.asText.get().trim()
    ).getParentFile()
  }

  def assetsFontsDir = new File(materialSymbolsDir, "assets/fonts")
  def availableFonts = assetsFontsDir.listFiles()
    ?.findAll { it.name.startsWith("MaterialSymbols") && it.name.endsWith(".ttf") }
    ?.collect { it.name.replaceFirst(/^MaterialSymbols/, '').replaceFirst(/\.ttf$/, '') } ?: []

  if (!availableFonts && materialSymbolsConfig != null) {
    throw new GradleException(
      "Found \"react-navigation\" > \"material-symbols\" in package.json, but no fonts are available in \"@react-navigation/material-symbols\" at ${JsonOutput.toJson(materialSymbolsDir.path)}.\n\n" +
        "If \"@react-navigation/material-symbols\" is overridden with an empty version, remove the override to use Material Symbols, or remove \"react-navigation\" > \"material-symbols\" from package.json."
    )
  }

  def validVariants = availableFonts.collect { it.split('_')[0].uncapitalize() }.unique().sort()
  def validWeights = availableFonts.collect { it.split('_')[1] as int }.unique().sort()
  def validFills = availableFonts.collect { it.endsWith("_Filled") ? 1 : 0 }.unique().sort()

  def errors = [] as Set

  if (fontsConfig != null && !(fontsConfig instanceof List)) {
    errors << "Invalid fonts ${JsonOutput.toJson(fontsConfig)}. Expected an array."
  }

  def fonts = []

  if (availableFonts) {
    fonts = fontsConfig instanceof List ? fontsConfig : [[:]]
  }

  fonts.each { font ->
    if (!(font instanceof Map)) {
      errors << "Invalid font ${JsonOutput.toJson(font)}. Expected an object."

      return
    }

    (font.keySet() - ["variant", "weights", "fills"]).each { key ->
      errors << "Unknown key ${JsonOutput.toJson(key)}."
    }

    if (font.variant != null && !validVariants.contains(font.variant)) {
      errors << "Invalid variant ${JsonOutput.toJson(font.variant)}."
    }

    if (font.weights != null && !(font.weights instanceof List)) {
      errors << "Invalid weights ${JsonOutput.toJson(font.weights)}. Expected an array."
    } else {
      font.weights.each { weight ->
        if (!validWeights.contains(weight)) {
          errors << "Invalid weight ${JsonOutput.toJson(weight)}."
        }
      }
    }

    if (font.fills != null && !(font.fills instanceof List)) {
      errors << "Invalid fills ${JsonOutput.toJson(font.fills)}. Expected an array."
    } else {
      font.fills.each { fill ->
        if (!validFills.contains(fill)) {
          errors << "Invalid fill ${JsonOutput.toJson(fill)}."
        }
      }
    }
  }

  if (errors) {
    throw new GradleException(
      "Invalid Material Symbols fonts in \"react-navigation\" > \"material-symbols\" > \"fonts\" in package.json.\n\n" +
        errors.join("\n") + "\n\n" +
        "Available variants: ${validVariants.collect { JsonOutput.toJson(it) }.join(", ")}.\n" +
        "Available weights: ${validWeights.join(", ")}.\n" +
        "Available fills: ${validFills.join(", ")}."
    )
  }

  def fontFiles = fonts.collectMany { font ->
    def variant = (font.variant ?: "outlined").capitalize()
    def weights = font.weights ?: [400]
    def fills = font.fills ?: [0]

    weights.collectMany { weight ->
      fills.collect { fill ->
        def suffix = fill == 1 ? "_Filled" : ""

        "MaterialSymbols${variant}_${weight}${suffix}.ttf"
      }
    }
  }

  def assetFiles = fontFiles ? fontFiles + "MaterialSymbols.codepoints" : []

  if (assetFiles) {
    from(assetsFontsDir) { include assetFiles }
  }

  into layout.buildDirectory.dir("intermediates/react-navigation/fonts")

  doFirst {
    if (destinationDir.exists()) {
      def extraFiles = destinationDir.listFiles()?.findAll { file -> !assetFiles.contains(file.name) }

      extraFiles?.each { file -> file.delete() }
    }
  }

  doLast {
    def digest = java.security.MessageDigest.getInstance("MD5")

    assetFiles.sort().each { name ->
      def assetFile = new File(assetsFontsDir, name)

      if (assetFile.exists()) {
        digest.update(assetFile.bytes)
      }
    }

    def hash = digest.digest().encodeHex().toString().take(8)
    def hashFile = new File(destinationDir, "MaterialSymbols.hash")

    hashFile.text = hash
  }
}

android.sourceSets.main.assets.srcDirs += layout.buildDirectory.dir("intermediates/react-navigation")

preBuild.dependsOn(copyMaterialFonts)

dependencies {
  implementation "com.facebook.react:react-android"
}
