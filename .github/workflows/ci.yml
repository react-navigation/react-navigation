name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify dependency versions
        run: pnpm versions check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup
        uses: ./.github/actions/setup

      - parallel:
          - name: Lint files
            run: pnpm lint

          - name: Typecheck files
            run: pnpm typecheck

          - name: Typecheck standalone static config
            run: pnpm typecheck:standalone:static

          - name: Typecheck standalone dynamic config
            run: pnpm typecheck:standalone:dynamic

          - name: Typecheck declarations
            run: pnpm typecheck:declarations

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test --maxWorkers=2 --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages in the monorepo
        run: pnpm lerna run prepack

      - name: Bundle example JavaScript with Metro
        run: pnpm example exec expo export --platform all

      - name: Bundle example JavaScript with Vite
        run: pnpm example web build
