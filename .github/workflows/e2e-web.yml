name: E2E / Web
on:
  push:
    branches:
      - 7.x
  pull_request:
    branches:
      - 7.x
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install nightly react-native-screens
        if: github.event_name == 'schedule'
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn up react-native-screens@nightly

      - name: Get Playwright version
        id: playwright
        run: |
          VERSION=$(yarn example node --print "require('@playwright/test/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright
        run: yarn example playwright install --with-deps

      - name: Cache Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Build example for web
        run: yarn example expo export --platform web

      - name: Run E2E tests
        run: yarn example e2e:web --retries=3
