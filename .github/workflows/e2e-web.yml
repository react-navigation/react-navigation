name: E2E / Web
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install nightly react-native-screens
        if: github.event_name == 'schedule'
        run: pnpm --recursive update react-native-screens@nightly --no-save

      - name: Get Playwright version
        id: playwright
        run: |
          VERSION=$(pnpm example exec node --print "require(require.resolve('playwright-core/package.json', { paths: [require.resolve('@e2e-dev/web')] })).version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install browsers
        run: pnpm example exec e2e-web install chromium firefox --with-deps

      - name: Cache Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run E2E tests
        run: pnpm example e2e:web --retries 3 --reporter list,junit

      - name: Store E2E output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-output-web
          path: example/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
